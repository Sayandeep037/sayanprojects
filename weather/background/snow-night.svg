<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <!-- Snowflake pattern -->
    <pattern id="snowflakes" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#ffffff" opacity="0.8" />
      <circle cx="30" cy="20" r="1.5" fill="#ffffff" opacity="0.7" />
      <circle cx="20" cy="40" r="2" fill="#ffffff" opacity="0.6" />
      <circle cx="40" cy="35" r="1.5" fill="#ffffff" opacity="0.7" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#nightSky)" />
  
  <!-- Snow -->
  <rect width="100%" height="100%" fill="url(#snowflakes)" />
  
  <!-- Clouds -->
  <g fill="#394d63">
    <path d="M200,150 Q300,100 400,150 T600,150 Q650,200 600,250 Q500,300 400,250 Q300,300 200,250 Q150,200 200,150 Z" opacity="0.8" />
    <path d="M100,300 Q200,250 300,300 T500,300 Q550,350 500,400 Q400,450 300,400 Q200,450 100,400 Q50,350 100,300 Z" opacity="0.7" />
  </g>
</svg>