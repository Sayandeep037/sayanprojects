<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <!-- Rain animation -->
    <pattern id="rain" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <line x1="10" y1="0" x2="5" y2="20" stroke="#6b9dc7" stroke-width="1" opacity="0.6" />
      <line x1="30" y1="10" x2="25" y2="30" stroke="#6b9dc7" stroke-width="1" opacity="0.6" />
      <line x1="40" y1="5" x2="35" y2="25" stroke="#6b9dc7" stroke-width="1" opacity="0.6" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#nightSky)" />
  
  <!-- Rain -->
  <rect width="100%" height="100%" fill="url(#rain)" />
  
  <!-- Clouds -->
  <g fill="#394d63">
    <path d="M200,150 Q300,100 400,150 T600,150 Q650,200 600,250 Q500,300 400,250 Q300,300 200,250 Q150,200 200,150 Z" opacity="0.8" />
    <path d="M100,300 Q200,250 300,300 T500,300 Q550,350 500,400 Q400,450 300,400 Q200,450 100,400 Q50,350 100,300 Z" opacity="0.7" />
  </g>
</svg>