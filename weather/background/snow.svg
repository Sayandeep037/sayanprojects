<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="100%" style="stop-color:#A9A9A9"/>
    </linearGradient>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
    <g id="cloud">
      <path d="M 25,60 a 20,20 0 0,1 0,-40 a 30,30 0 0,1 60,0 a 20,20 0 0,1 0,40 z" fill="#D3D3D3" filter="url(#cloudBlur)"/>
    </g>
    <circle id="snowflake" cx="0" cy="0" r="3" fill="white"/>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>
  <use href="#cloud" x="400" y="200" transform="scale(2)"/>
  <use href="#cloud" x="900" y="300" transform="scale(1.5)"/>
  <use href="#cloud" x="1400" y="250" transform="scale(2.2)"/>
  
  <g id="snowflakes">
    <use href="#snowflake" x="450" y="400"/>
    <use href="#snowflake" x="650" y="450"/>
    <use href="#snowflake" x="850" y="420"/>
    <use href="#snowflake" x="1050" y="440"/>
    <use href="#snowflake" x="1250" y="410"/>
    <use href="#snowflake" x="1450" y="430"/>
    <use href="#snowflake" x="550" y="480"/>
    <use href="#snowflake" x="750" y="460"/>
    <use href="#snowflake" x="950" y="470"/>
    <use href="#snowflake" x="1150" y="450"/>
  </g>
  
  <animateTransform
    href="#snowflakes"
    attributeName="transform"
    type="translate"
    from="0 -100"
    to="0 1080"
    dur="3s"
    repeatCount="indefinite">
  </animateTransform>
</svg>