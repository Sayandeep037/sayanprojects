<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE"/>
      <stop offset="100%" style="stop-color:#778899"/>
    </linearGradient>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
    <g id="cloud">
      <path d="M 25,60 a 20,20 0 0,1 0,-40 a 30,30 0 0,1 60,0 a 20,20 0 0,1 0,40 z" fill="white" filter="url(#cloudBlur)"/>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>
  <use href="#cloud" x="400" y="200" transform="scale(2)"/>
  <use href="#cloud" x="900" y="300" transform="scale(1.5)"/>
  <use href="#cloud" x="1400" y="250" transform="scale(2.2)"/>
  <use href="#cloud" x="600" y="400" transform="scale(1.8)"/>
</svg>