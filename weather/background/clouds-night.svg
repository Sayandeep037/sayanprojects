<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <!-- Cloud filter -->
    <filter id="cloudGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#nightSky)" />
  
  <!-- Moon behind clouds -->
  <circle cx="600" cy="150" r="40" fill="#ffd700" opacity="0.7" />
  <circle cx="580" cy="150" r="35" fill="url(#nightSky)" opacity="0.7" />
  
  <!-- Clouds -->
  <g fill="#394d63" filter="url(#cloudGlow)">
    <path d="M200,200 Q300,150 400,200 T600,200 Q650,250 600,300 Q500,350 400,300 Q300,350 200,300 Q150,250 200,200 Z" opacity="0.8" />
    <path d="M100,350 Q200,300 300,350 T500,350 Q550,400 500,450 Q400,500 300,450 Q200,500 100,450 Q50,400 100,350 Z" opacity="0.7" />
  </g>
</svg>