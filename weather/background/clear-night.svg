<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1729;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <!-- Star pattern -->
    <pattern id="stars" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#ffffff" opacity="0.8" />
      <circle cx="25" cy="20" r="1.2" fill="#ffffff" opacity="0.8" />
      <circle cx="40" cy="30" r="1" fill="#ffffff" opacity="0.8" />
      <circle cx="15" cy="40" r="1.1" fill="#ffffff" opacity="0.8" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#nightSky)" />
  
  <!-- Stars -->
  <rect width="100%" height="100%" fill="url(#stars)" opacity="0.8" />
  
  <!-- Moon -->
  <circle cx="600" cy="150" r="40" fill="#ffd700" />
  <circle cx="580" cy="150" r="35" fill="url(#nightSky)" />
</svg>