<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5D6B"/>
      <stop offset="100%" style="stop-color:#2F4F4F"/>
    </linearGradient>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
    <g id="cloud">
      <path d="M 25,60 a 20,20 0 0,1 0,-40 a 30,30 0 0,1 60,0 a 20,20 0 0,1 0,40 z" fill="#708090" filter="url(#cloudBlur)"/>
    </g>
    <line id="raindrop" x1="0" y1="0" x2="0" y2="20" stroke="#B0E0E6" stroke-width="2" stroke-linecap="round"/>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyGradient)"/>
  <use href="#cloud" x="400" y="200" transform="scale(2)"/>
  <use href="#cloud" x="900" y="300" transform="scale(1.5)"/>
  <use href="#cloud" x="1400" y="250" transform="scale(2.2)"/>
  
  <g id="raindrops">
    <use href="#raindrop" x="450" y="400"/>
    <use href="#raindrop" x="650" y="450"/>
    <use href="#raindrop" x="850" y="420"/>
    <use href="#raindrop" x="1050" y="440"/>
    <use href="#raindrop" x="1250" y="410"/>
    <use href="#raindrop" x="1450" y="430"/>
    <use href="#raindrop" x="550" y="480"/>
    <use href="#raindrop" x="750" y="460"/>
    <use href="#raindrop" x="950" y="470"/>
    <use href="#raindrop" x="1150" y="450"/>
  </g>
  
  <animateTransform
    href="#raindrops"
    attributeName="transform"
    type="translate"
    from="0 -100"
    to="0 1080"
    dur="1.5s"
    repeatCount="indefinite"/>
</svg>